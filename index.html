<!doctype html><html lang="de"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Restlos Bewerbung</title>
<style>
:root{--bg:#f1f4f5;--card:#fff;--text:#203441;--muted:#667d89;--line:#dce5e7;--accent:#167c77;--input:#f8fafb}*{box-sizing:border-box}body{margin:0;font:14px 'DejaVu Sans',sans-serif;background:var(--bg);color:var(--text)}body.dark{--bg:#15232e;--card:#20323e;--text:#e3edef;--muted:#a6bbc5;--line:#3a505c;--input:#172a35}button,input,textarea,select{font:inherit}button{cursor:pointer;border:1px solid var(--line);border-radius:9px;padding:11px 15px;background:var(--card);color:var(--text)}button:hover{border-color:var(--accent)}button:focus-visible,input:focus,textarea:focus,select:focus{outline:2px solid #50b9ae;outline-offset:2px}.primary{background:var(--accent);color:white;border-color:var(--accent)}.shell{display:grid;grid-template-columns:238px 1fr;min-height:100vh}aside{background:#112c38;color:#d9e8ec;padding:30px 20px;position:fixed;width:238px;top:0;bottom:0;display:flex;flex-direction:column}.brand{font-size:14px;font-weight:bold;letter-spacing:-.6px;display:flex;align-items:center;gap:10px}.mark{background:#6ce0c3;color:#103945;border-radius:12px;padding:9px 13px;font-size:23px}.small{font-size:12px;color:var(--muted);line-height:1.6}.brand-sub{color:#8faeb9;margin:12px 0 36px;font-size:11px;letter-spacing:2px}.nav{border:0;color:#c0d2d9;background:transparent;text-align:left;width:100%;margin:4px 0;padding:13px}.nav.active{background:#244652;color:#9bf1dc}.side-title{font-size:10px;letter-spacing:2px;color:#7e9ba7;margin:29px 12px 10px}.bottom{margin-top:auto;border-top:1px solid #34505a;padding-top:20px;color:#92b8bc;line-height:1.7;font-size:12px}.bottom button{background:transparent;color:#c8dce0;border-color:#34505a;padding:8px;margin-top:10px}main{grid-column:2;padding:30px 34px}.top{display:flex;justify-content:space-between;align-items:center;gap:16px;margin-bottom:28px}.eyebrow{text-transform:uppercase;letter-spacing:2px;font-size:10px;font-weight:bold;color:var(--accent)}h1{font-size:30px;letter-spacing:-1px;margin:8px 0}h2{font-size:19px;letter-spacing:-.4px;margin:0 0 10px}h3{font-size:14px;margin:0 0 15px}.actions{display:flex;gap:10px;align-items:center;flex-wrap:wrap}.pill{font-size:11px;color:var(--accent);background:#dff3ed;padding:7px 11px;border-radius:20px}.hero{border-radius:17px;background:#183c48;padding:28px 32px;color:white;margin-bottom:26px;display:flex;justify-content:space-between;gap:25px}.hero h2{font-size:25px}.hero p{color:#b7d0d8;max-width:600px;line-height:1.7;margin-bottom:0}.hero .number{font-size:54px;font-weight:bold;color:#8ee6cf}.grid{display:grid;grid-template-columns:minmax(350px,1fr) minmax(340px,1fr);gap:24px}.card{background:var(--card);border:1px solid var(--line);border-radius:15px;padding:25px;margin-bottom:18px}.card p{line-height:1.7}.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:16px}.field{display:block;margin:0 0 17px;font-size:12px;font-weight:bold}.field span{display:block;margin-bottom:8px}.field input,.field textarea,.field select{width:100%;border:1px solid var(--line);background:var(--input);color:var(--text);border-radius:8px;padding:11px;font-weight:normal;font-size:13px;line-height:1.6}.field textarea{resize:vertical;min-height:100px}.wide{grid-column:1/-1}.hint{font-size:12px;color:var(--muted);line-height:1.7;margin-bottom:18px}.application{display:flex;align-items:center;gap:15px}.app-icon{background:#e1f1ec;color:#167c77;padding:15px;border-radius:12px;font-size:21px}.application .info{flex:1}.application h3{margin-bottom:5px}.empty{padding:40px;text-align:center;color:var(--muted)}.steps{display:flex;gap:7px;margin-bottom:20px;flex-wrap:wrap}.steps button{padding:9px 12px;font-size:12px}.steps button.active{background:#dff3ed;color:#126b63;border-color:#a5d5c7}.preview{position:sticky;top:20px;align-self:start;max-height:calc(100vh - 40px);overflow:auto;background:#dce5e8;border-radius:15px;padding:18px;color:#24404c}.preview header{display:flex;justify-content:space-between;align-items:center;margin-bottom:15px}.preview img{width:100%;height:auto;box-shadow:0 5px 20px #19333e20;margin-bottom:16px;background:white}.preview .placeholder{padding:65px 30px;text-align:center;border:1px dashed #9cb3bd;background:#eef4f5;border-radius:8px;line-height:1.8}.template-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-bottom:20px}.template{padding:12px}.template.selected{border:2px solid var(--accent)}.mini{height:130px;background:white;border:1px solid #e2e6e7;padding:18px 12px;text-align:left;margin-bottom:9px}.mini b{font-size:14px;display:block;margin-bottom:13px}.mini i{display:block;height:3px;background:#d6dfe3;margin:7px 0}.mini i:nth-child(3n){width:65%}.notice{position:fixed;bottom:24px;right:25px;max-width:520px;background:#123c46;color:white;box-shadow:0 8px 30px #0003;padding:15px 22px;border-radius:12px;z-index:5;white-space:pre-wrap}.issue{padding:12px 14px;background:var(--input);border-radius:8px;margin:9px 0;line-height:1.6;font-size:13px}.issue.warn{border-left:3px solid #cb9336}.issue.good{border-left:3px solid #2b9a7e}.attachment{display:flex;align-items:center;gap:6px;border-bottom:1px solid var(--line);padding:12px 0}.attachment span{flex:1;word-break:break-all;font-size:12px}.attachment button{padding:6px 9px}#saveState{font-size:11px;color:var(--muted)}@media(max-width:1100px){.shell{grid-template-columns:200px 1fr}aside{width:200px;padding:25px 14px}main{padding:25px 20px}.grid{grid-template-columns:1fr}.preview{position:static;max-height:none}.brand{font-size:15px}}@media print{aside,.top{display:none}}

.profile-label{font-size:10px;letter-spacing:1px;color:#a5c6cc}.profile-label select{width:100%;background:#244652;color:#fff;border:1px solid #3a6270;border-radius:8px;padding:10px;margin:8px 0;font:13px 'DejaVu Sans'}.brand-sub{margin-bottom:22px}.nav{padding:10px}.side-title{margin-top:15px}.document-row{display:flex;gap:18px;justify-content:space-between;border-top:1px solid var(--line);padding:18px 0;align-items:center}.document-row .small{overflow-wrap:anywhere}.category-select{background:var(--input);color:var(--text);border:1px solid var(--line);padding:11px;border-radius:8px}.examples{border:1px solid var(--line);border-radius:10px;padding:13px;margin:-5px 0 22px}.examples summary{cursor:pointer;color:var(--accent);font-size:12px;font-weight:bold}.example{border-top:1px solid var(--line);margin-top:15px;font-size:12px;line-height:1.7}.example button{padding:7px;font-size:11px}.spelling{font-size:11px;margin:-8px 0 20px;line-height:1.6;color:#9b5f16}.spelling:empty{display:none}.spell-row{display:flex;gap:6px;flex-wrap:wrap;align-items:center;margin-top:6px}.spell-row b{text-decoration:underline wavy #c04747;text-underline-offset:3px}.spell-row button{padding:3px 7px;font-size:11px}.spell-ok{color:var(--accent)}.ignore-word{color:var(--muted)}.library-choice{display:block;margin:7px 0;width:100%;text-align:left}.modal{position:fixed;inset:0;background:#091e2ad9;z-index:20;display:flex;align-items:center;justify-content:center;padding:30px}.modal-content{background:var(--card);border-radius:18px;padding:28px;max-width:1150px;width:100%;max-height:92vh;overflow:auto;box-shadow:0 30px 90px #0005}.import-grid{display:grid;grid-template-columns:1fr 1fr;gap:25px;margin-bottom:24px}.import-field{margin-bottom:16px}.import-field label{font-size:12px;font-weight:bold}.import-field textarea,.source-text{width:100%;background:var(--input);color:var(--text);padding:12px;border:1px solid var(--line);border-radius:8px;line-height:1.6;margin-top:8px;font:12px 'DejaVu Sans'}.source-text{min-height:550px;resize:vertical}.tree{font:13px monospace;line-height:1.8;overflow:auto}.sidebar-mini{position:relative;padding-left:35px;overflow:hidden}.sidebar-mini:before{content:'';position:absolute;left:6px;top:8px;bottom:8px;width:23px;background:#d3e8df;border-radius:4px}.sidebar-mini.Graphit:before{background:#c7cdda}.sidebar-mini.Sand:before{background:#e9d8c3}.mini b{font-size:12px}.template-grid{grid-template-columns:repeat(3,1fr)}

.entry-card{border:1px solid var(--line);border-radius:12px;padding:18px;margin:18px 0;background:var(--input)}.entry-heading{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:18px}.entry-heading button{padding:6px 10px}.check-line{display:flex;align-items:center;gap:9px;margin:14px 0;font-size:13px;line-height:1.5}.photo-editor{display:flex;gap:20px;align-items:center;margin:20px 0}.photo-thumbnail{flex:none;width:120px;min-height:145px;background:var(--input);border:1px dashed #87aaa7;border-radius:10px;display:flex;align-items:center;justify-content:center;color:var(--muted);font-size:11px;text-align:center;line-height:1.8;padding:7px}.photo-thumbnail img{width:104px;max-height:145px;object-fit:contain}.photo-editor button{margin:0 7px 8px 0}.section-row{display:flex;align-items:center;gap:8px;padding:9px 0;border-bottom:1px solid var(--line)}.section-row span{flex:1}.section-row button{padding:5px 10px}.sidebar-mini.Nordlicht:before{background:#174a65}.sidebar-mini.Elegant:before{background:#e6e0ef;border-left:3px solid #5b4178}.sidebar-mini.Kontur:before{background:white;border:1px solid #3d6453}.sidebar-mini.Studio:before{background:#efdcd6;border-top:5px solid #ad4e3f}.banner-mini{border-top:12px solid #234d72}.editorial-mini{border-left:4px solid #954b37}.field input[type=color]{height:44px;padding:4px}.field input[type=range]{padding:8px 0}.field input:disabled{opacity:.45}
.application{flex-wrap:wrap}.application .info{min-width:180px}.application h3{overflow-wrap:anywhere}button:disabled{cursor:wait;opacity:.6}</style>
<div class="shell"><aside><div class="brand"><img src="icon.svg" width="38" height="38" alt="Restlos">Restlos Bewerbung</div><div class="brand-sub">DEIN NÄCHSTER SCHRITT.</div><label class="profile-label">AKTIVES PROFIL<select id="profileSelect" onchange="switchProfile(this.value)"></select></label><button class="nav" onclick="addProfile()">+ Neues Profil</button><button class="nav" data-nav="home" onclick="navigate('home')">▦ &nbsp; Meine Bewerbungen</button><button class="nav" data-nav="profile" onclick="navigate('profile')">◎ &nbsp; Mein Profil</button><button class="nav" data-nav="documents" onclick="navigate('documents')">▧ &nbsp; Dokumentablage</button><div class="side-title">DEIN ARBEITSPLATZ</div><button class="nav" data-nav="editor" onclick="navigate('editor')">▤ &nbsp; Bewerbung bearbeiten</button><button class="nav" data-nav="backup" onclick="navigate('backup')">↗ &nbsp; Sicherung & Daten</button><button class="nav" data-nav="settings" onclick="navigate('settings');bridge('update_status')">↻ &nbsp; Updates & Startcheck</button><div class="bottom">● Lokal auf deinem Computer<br>Deine Profile. Deine Dokumente.<br><button onclick="document.body.classList.toggle('dark')">Hell / Dunkel</button><p>Version 0.9 · Dein Bewerbungsstudio</p></div></aside><main><div class="top"><div><div class="eyebrow" id="eyebrow">Dein Bewerbungsstudio</div><h1 id="heading">Ein guter nächster Schritt.</h1><span id="saveState">Wird geladen …</span></div><div class="actions"><span class="pill">● Lokal gespeichert</span><button class="primary" onclick="newApp()">+ Neue Bewerbung</button></div></div><div id="content"></div></main></div><div id="toast" class="notice" hidden role="status"></div>
<script>
let dataRoot='',profileFolder='',previewToken=0,spellTimers={},spellData={},importData=null;let state=null,current=null,page='home',step='stelle',saveTimer,previewTimer,previewPages=[],previewBusy=false,previewDirty=false;
const $=id=>document.getElementById(id);const esc=x=>String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function app(){return state.applications.find(a=>a.id===current)||state.applications[0]}
function syncState(){if(state){compileForms();let p=activeProfile();p.profile=state.profile;p.applications=state.applications;}}
function activeProfile(){return state.profiles.find(p=>p.id===state.selectedProfile)}
function bridge(action,extra={}){syncState();if(window.atelierSend)window.atelierSend(JSON.stringify({action,data:state,id:current,...extra}));else toast('Bitte über „Restlos Bewerbung starten.sh“ öffnen.');}

function receive(msg){
 if(msg.type==='load'){state=msg.data;photoPreview=msg.photoPreview||'';dataRoot=msg.root||dataRoot;profileFolder=msg.folder||profileFolder;if(!state.applications.some(a=>a.id===current))current=state.applications[0].id;render();$('saveState').textContent='Alle Änderungen lokal gespeichert';}
 if(msg.type==='photo_preview'&&msg.profileId===state.selectedProfile){photoPreview=msg.image;if($('photoPreview'))$('photoPreview').src='data:image/png;base64,'+msg.image;}
 if(msg.type==='saved')$('saveState').textContent='Gespeichert · Dokumente automatisch abgelegt';
 if(msg.type==='error'){previewBusy=false;toast('Hinweis: '+msg.text);$('saveState').textContent='Bitte Hinweis prüfen';}
 if(msg.type==='progress'){$('saveState').textContent=msg.text;}
 if(msg.type==='export_report'){showExportReport(msg);}
 if(msg.type==='notice')toast(msg.text);
 if(msg.type==='spell'&&msg.profileId===state.selectedProfile){let el=$(msg.field);if(el&&el.value===msg.text){spellData[msg.field]=msg.issues;renderSpelling(msg.field);}}
 if(msg.type==='import'){if(state.selectedProfile!==msg.profileId||current!==msg.applicationId){toast('Das Dokument wurde gespeichert. Öffne es im ursprünglichen Profil erneut zur Datenübernahme.');return;}importData=msg;showImport();}
 if(msg.type==='preview'){previewBusy=false;if(previewDirty||msg.token!==previewToken){previewDirty=false;requestPreview();return;}previewPages=msg.pages;paintPreview();if($('previewStatus'))$('previewStatus').textContent=msg.count+' Seiten'+(msg.count>12?' · Vorschau: erste 12':'');}
}

function toast(s){$('toast').textContent=s;$('toast').hidden=false;setTimeout(()=>$('toast').hidden=true,6500)}
function changed(){clearTimeout(saveTimer);$('saveState').textContent='Änderungen werden gespeichert …';saveTimer=setTimeout(()=>bridge('save'),450);if(page==='editor'||page==='profile'){previewDirty=previewBusy;clearTimeout(previewTimer);previewTimer=setTimeout(requestPreview,900)}}
function flush(){if(state){clearTimeout(saveTimer);bridge('save')}}
function navigate(p){flush();page=p;render()}
function update(scope,key,value){(scope==='p'?state.profile:app())[key]=value;if(scope==='a'&&key==='letter')app().form.letterMode='text';if(scope==='p'&&sectionNames[key])state.profile.form[key].mode='text';compileForms();changed();scheduleSpelling(scope+'-'+key);}

function field(scope,key,label,multi=false,placeholder='',wide=false){let value=(scope==='p'?state.profile:app())[key],id=scope+'-'+key;return `<div class="${wide?'wide':''}"><label class="field"><span>${label}</span>${multi?`<textarea id="${id}" lang="de" spellcheck="false" rows="${key==='letter'?16:5}" placeholder="${esc(placeholder)}" oninput="update('${scope}','${key}',this.value)">${esc(value)}</textarea>`:`<input id="${id}" value="${esc(value)}" placeholder="${esc(placeholder)}" oninput="update('${scope}','${key}',this.value)">`}</label>${multi&&key!=='job'&&key!=='recipient'&&key!=='address'?`<div class="spelling" id="spell-${id}" aria-live="polite"></div>`:''}</div>`}

function newApp(){if(!state)return;flush();let date=new Date().toLocaleDateString('de-DE');let a={id:crypto.randomUUID?crypto.randomUUID():String(Date.now()),company:'',position:'',recipient:'',location:'',date,salutation:'Sehr geehrte Damen und Herren,',job:'',motivation:'',evidence:'',letter:'',status:'Entwurf',template:'Seitenleiste',attachments:[]};state.applications.push(a);current=a.id;page='editor';step='stelle';changed();render()}
function render(){if(!state)return;ensureForms();compileForms();previewOverride=null;previewToken++;document.querySelectorAll('[data-nav]').forEach(b=>b.classList.toggle('active',b.dataset.nav===page));$('profileSelect').innerHTML=state.profiles.map(p=>`<option value="${p.id}" ${p.id===state.selectedProfile?'selected':''}>${esc(p.label)}</option>`).join('');let titles={home:'Ein guter nächster Schritt.',profile:'Deine Erfahrung. Dein Profil.',editor:app().position||'Deine neue Bewerbung',documents:'Deine Unterlagen. Alles am Platz.',backup:'Deine Daten bleiben bei dir.'};$('heading').textContent=titles[page];$('content').innerHTML=page==='home'?home():page==='profile'?profile():page==='backup'?backup():page==='documents'?documents():editor();if(page==='editor'||page==='profile'){previewPages=[];requestPreview()}document.querySelectorAll('textarea').forEach(el=>{if(el.id)scheduleSpelling(el.id)});}

function deleteApp(id){if(!confirm('Diese Bewerbung löschen? Bereits exportierte PDFs bleiben erhalten.'))return;state.applications=state.applications.filter(a=>a.id!==id);if(!state.applications.length){state.applications=[{id:crypto.randomUUID(),company:'',position:'',recipient:'',location:'',date:new Date().toLocaleDateString('de-DE'),salutation:'Sehr geehrte Damen und Herren,',job:'',motivation:'',evidence:'',letter:'',status:'Entwurf',template:'Seitenleiste',attachments:[]}];}current=state.applications[0].id;changed();render()}
function home(){let sent=state.applications.filter(a=>a.status!=='Entwurf').length;return `<div class="hero"><div><div class="eyebrow" style="color:#8ee6cf">RAUM FÜR DEINE ZUKUNFT</div><h2 style="margin-top:12px">Aus Erfahrung wird Überzeugung.</h2><p>Dein Werdegang, die passende Stelle und ein klares Design.<br>Alles für deinen nächsten beruflichen Schritt – an einem Ort.</p></div><div><div class="number">${String(state.applications.length).padStart(2,'0')}</div><span style="color:#b7d0d8">Bewerbungen · ${sent} weitergeführt</span></div></div><div class="actions" style="justify-content:space-between;margin-bottom:18px"><h2>Deine Bewerbungen</h2><button onclick="navigate('profile')">Profil vervollständigen ↗</button></div>${state.applications.map(a=>`<div class="card application"><div class="app-icon">▤</div><div class="info"><h3>${esc(a.position||'Neue Bewerbung')}</h3><span class="small">${esc(a.company||'Unternehmen noch ergänzen')} · ${esc(a.date)}</span></div><span class="pill">${esc(a.status)}</span><button onclick="duplicateApp('${esc(a.id)}')">Kopieren</button><button aria-label="Bewerbung löschen" onclick="deleteApp('${esc(a.id)}')">×</button><button onclick="current='${esc(a.id)}';step='stelle';navigate('editor')">Bearbeiten →</button></div>`).join('')}<div class="hint">Tipp: Lege für jede Stelle eine eigene Bewerbung an. Dein Profil wird gemeinsam genutzt; Anschreiben, Vorlage und Anlagen gehören zur jeweiligen Bewerbung.</div>`}
function profile(){return `<div class="grid"><div><div class="card"><h2>Das bist du</h2><button onclick="page='documents';render()">Alten Lebenslauf importieren →</button><p class="hint">Diese Angaben gehören zum ausgewählten Profil. Andere Profile bleiben unabhängig. Jede Bewerbung hat einen eigenen Ordner mit bearbeitbaren Daten und automatisch erzeugten PDFs.</p><div class="form-grid">${field('p','name','Vor- und Nachname')}${field('p','title','Beruf / Profilüberschrift')}${field('p','email','E-Mail')}${field('p','phone','Telefon')}${field('p','address','Adresse',true,'Straße und Hausnummer\nPLZ und Ort',true)}</div></div><div class="card"><h2>Dein Werdegang</h2>${field('p','experience','Berufserfahrung',true,'MM/JJJJ – heute · Position · Unternehmen\nDeine Aufgaben und konkrete Leistungen\n\nNächste Station …')}${field('p','education','Ausbildung & Weiterbildung',true,'Zeitraum · Abschluss · Einrichtung')}</div></div><div><div class="card"><h2>Was du mitbringst</h2>${field('p','skills','Kenntnisse',true,'Zum Beispiel: Excel – Pivot-Tabellen und Auswertungen')}${field('p','languages','Sprachen',true,'Deutsch – Muttersprache\nEnglisch – B2')}</div><div class="card"><div class="eyebrow">GUT ZU WISSEN</div><h2 style="margin-top:12px">Konkretes überzeugt.</h2><p>Beschreibe Aufgaben, Verantwortung und Ergebnisse. Zahlen helfen, wenn du sie belegen kannst.</p><p class="hint">Neueste Station zuerst. Trenne Stationen durch eine Leerzeile. Geburtsdatum, Familienstand und Foto sind für diesen Lebenslauf nicht erforderlich.</p><button class="primary" onclick="navigate('editor')">Zur Bewerbung →</button></div></div></div>`}
function editor(){return `<div class="steps">${[['stelle','01 · Stelle'],['text','02 · Anschreiben'],['design','03 · Gestaltung'],['anlagen','04 · Anlagen'],['check','05 · Prüfen & Export']].map(([k,t])=>`<button class="${step===k?'active':''}" onclick="step='${k}';render()">${t}</button>`).join('')}</div><div class="grid"><div>${editorBody()}</div><div class="preview"><header><strong>Echte PDF-Vorschau</strong><span class="small" id="previewStatus">Wird erstellt …</span></header><div id="pages"><div class="placeholder">Deine Bewerbung nimmt Form an.<br>Die Vorschau wird direkt aus dem PDF erzeugt.</div></div><div class="small">${step==='design'?'Lebenslauf in der gewählten Vorlage':'Anschreiben und Lebenslauf · Anlagen werden beim Gesamtexport ergänzt.'}</div></div></div>`}
function editorBody(){let a=app();if(step==='stelle')return `<div class="card"><h2>Wohin soll es gehen?</h2><p class="hint">Mit einer konkreten Stelle wird aus deinem Profil eine persönliche Bewerbung.</p><div class="form-grid">${field('a','company','Unternehmen')}${field('a','position','Beworbene Position')}<div class="wide">${recipientForm()}</div>${field('a','location','Dein Ort')}${field('a','date','Datum')}</div>${field('a','job','Stellenanzeige',true,'Füge die Stellenanzeige hier als Text ein. Sie bleibt lokal gespeichert.')}<label class="field"><span>Bearbeitungsstand</span><select onchange="update('a','status',this.value)">${['Entwurf','Versendet','Gespräch','Zusage','Absage'].map(x=>`<option ${a.status===x?'selected':''}>${x}</option>`).join('')}</select></label><button class="primary" onclick="step='text';render()">Weiter zum Anschreiben →</button></div>`;
if(step==='text')return letterEditor();
if(step==='design')return designEditor();

function checks(){let p=state.profile,a=app(),all=Object.values(p).join(' ')+' '+a.letter;let out=[[!!p.name.trim(),p.name.trim()?'Name vorhanden.':'Bitte deinen Namen im Profil ergänzen.'],[/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(p.email),'E-Mail-Adresse auf korrekte Schreibweise prüfen.'],[!!(a.company.trim()&&a.position.trim()),'Unternehmen und Position müssen ausgefüllt sein.'],[!!a.letter.trim()&&(a.form.letterMode==='text'||!!a.motivation.trim()&&!!a.evidence.trim()),a.form.letterMode==='form'?'Einstieg und passende Erfahrung müssen ausgefüllt sein.':'Anschreibentext prüfen.'],[!!p.experience.trim()||!!p.education.trim(),'Berufserfahrung oder Ausbildung im Profil ergänzen.'],[!(/\[[^\]]+\]|XXX|TODO|Musterfirma/i.test(all)),'Auf offene Platzhalter geprüft.'],[a.letter.split(/\s+/).length<450,'Textumfang: längere Anschreiben können mehr als eine Seite benötigen.']];let dates=[...all.matchAll(/(\d{2})\/(\d{4})\s*[–-]\s*(\d{2})\/(\d{4})/g)];let wrong=dates.some(m=>+m[1]>12||+m[1]<1||+m[3]>12||+m[3]<1||Number(m[2]+m[1])>Number(m[4]+m[3]));out.push([!wrong,wrong?'Mindestens ein Zeitraum ist ungültig oder rückwärts.':'Erkannte Zeiträume (MM/JJJJ) ohne offensichtlichen Widerspruch.']);return out}
function draft(){let a=app();if(!a.position.trim()||!a.motivation.trim()||!a.evidence.trim()){toast('Bitte Position, Motivation und passende Erfahrung ergänzen.');return}window.proposed=a.motivation.trim()+'\n\n'+a.evidence.trim()+'\n\nGern erläutere ich Ihnen in einem persönlichen Gespräch, wie ich meine Erfahrung als '+a.position+' bei Ihnen einbringen kann.';$('draftArea').innerHTML='<p class="hint" style="margin-top:18px">Vorschlag ausschließlich aus deiner Motivation, Erfahrung und der Position:</p><div class="issue">'+esc(window.proposed).replace(/\n/g,'<br>')+'</div><button class="primary" onclick="acceptDraft()">Diesen Entwurf übernehmen</button>'}

function moveAttachment(i,d){let a=app().attachments,j=i+d;if(j<0||j>=a.length)return;[a[i],a[j]]=[a[j],a[i]];changed();render()}
function requestPreview(){if(page!=='editor'&&page!=='profile')return;if(previewBusy){previewDirty=true;return}previewBusy=true;previewDirty=false;previewToken++;if($('previewStatus'))$('previewStatus').textContent='Wird aktualisiert …';bridge('preview',{token:previewToken,kind:previewOverride||(page==='profile'||step==='design'?'cv':'all')})}

function backup(){return `<div class="card"><h2>Profile und Dokumente gemeinsam sichern.</h2><p>Die ZIP-Sicherung enthält alle Profile, die Dokumentablage, bearbeitbare Bewerbungen und gespeicherte PDFs.</p><div class="actions"><button class="primary" onclick="bridge('backup')">Sicherung speichern</button><button onclick="bridge('restore')">Sicherung wiederherstellen</button><button onclick="bridge('open_folder')">Profilordner öffnen</button></div><p class="hint">Vor einer Wiederherstellung wird der aktuelle Datenbestand automatisch gesichert. Sicherungen sind nicht verschlüsselt.</p></div><div class="card"><h2>Deine Ordnerstruktur</h2><p class="hint">${esc(dataRoot)}</p><pre class="tree">Profile / Profilname

function switchProfile(id){$('importModal')?.remove();importData=null;flush();syncState();let p=state.profiles.find(p=>p.id===id);state.selectedProfile=id;photoPreview='';state.profile=p.profile;state.applications=p.applications;current=p.applications[0].id;page='home';previewDirty=true;changed();render();bridge('photo_preview');}
function addProfile(){let label=prompt('Name für das neue Profil, zum Beispiel dein Name oder „Beruflicher Neustart“:');if(label&&label.trim()){flush();bridge('new_profile',{label:label.trim()});page='profile';}}
function libraryAttachments(){let docs=activeProfile().documents.filter(d=>d.name.toLowerCase().endsWith('.pdf')&&!app().attachments.includes(d.path));return docs.map(d=>`<button class="library-choice" onclick="useAttachment('${d.id}')">+ ${esc(d.name)}</button>`).join('')||'<p class="hint">Keine weiteren PDFs in der Ablage.</p>'}
function useAttachment(id){let d=activeProfile().documents.find(d=>d.id===id);if(!app().attachments.includes(d.path))app().attachments.push(d.path);changed();render();}
function documents(){return `<div class="hero"><div><div class="eyebrow" style="color:#8ee6cf">ALTE BEWERBUNG → NEUER START</div><h2 style="margin-top:12px">Deine Erfahrung ist schon da.</h2><p>Importiere einen vorhandenen Lebenslauf oder ein Anschreiben. Restlos liest den Text lokal aus und schlägt passende Angaben vor. Du entscheidest, was übernommen wird.</p></div></div><div class="card"><div class="actions"><select id="documentCategory" class="category-select">${['Lebenslauf','Anschreiben','Zeugnisse','Zertifikate','Sonstiges','Fotos'].map(c=>`<option>${c}</option>`).join('')}</select><button class="primary" onclick="bridge('import',{category:$('documentCategory').value,extract:true})">Datei importieren & Daten erkennen</button><button onclick="bridge('import',{category:$('documentCategory').value,extract:false})">Nur zur Ablage hinzufügen</button><button onclick="bridge('open_folder')">Profilordner öffnen ↗</button></div><p class="hint">Datenübernahme aus PDF, DOCX, ODT, TXT und Bilddateien. Scans werden lokal per OCR gelesen. Bei mehreren Dateien wird die erste analysiert; weitere lassen sich einzeln öffnen. Die lokale Texterkennung startet bei gescannten Seiten automatisch. Bitte erkannte Wörter und Zahlen im Prüfungsdialog kontrollieren.</p></div>${['Lebenslauf','Anschreiben','Zeugnisse','Zertifikate','Sonstiges','Fotos'].map(c=>`<div class="card"><h2>${c}</h2>${activeProfile().documents.filter(d=>d.category===c).map(d=>`<div class="document-row"><div><strong>${esc(d.name)}</strong><div class="small">${esc(d.path)}</div></div><div class="actions"><button onclick="bridge('open_document',{document:'${d.id}'})">Öffnen</button><button onclick="bridge('analyze_document',{document:'${d.id}'})">Daten übernehmen</button>${d.name.toLowerCase().endsWith('.pdf')?`<button onclick="useAttachment('${d.id}');toast('Der aktuellen Bewerbung als Anlage zugeordnet.');">Als Anlage</button>`:''}</div></div>`).join('')||'<p class="hint">Hier kannst du Dokumente hinzufügen. Restlos übernimmt die Ablage für dich.</p>'}</div>`).join('')}`}
const fieldNames={name:'Name',title:'Beruf / Profilüberschrift',email:'E-Mail',phone:'Telefon',address:'Adresse',experience:'Berufserfahrung',education:'Ausbildung',skills:'Kenntnisse',languages:'Sprachen',salutation:'Anrede',letter:'Anschreiben',position:'Beworbene Position'};
function showImport(){let d=importData;document.getElementById('importModal')?.remove();let box=document.createElement('div');box.id='importModal';box.className='modal';box.innerHTML=`<div class="modal-content"><div class="actions" style="justify-content:space-between"><h2>Erkannte Angaben prüfen</h2><button onclick="$('importModal').remove()">Schließen ×</button></div><p class="hint">${esc(d.document.name)} · Original im Profilordner gespeichert.<br>${d.notes.map(esc).join('<br>')}</p><div class="import-grid"><div>${Object.entries(d.fields).map(([k,v])=>`<div class="import-field"><label><input type="checkbox" id="use-${k}" checked> ${fieldNames[k]||esc(k)} übernehmen</label><textarea id="import-${k}" rows="${v.length>150?6:2}">${esc(v)}</textarea></div>`).join('')||'<p>Keine eindeutigen Felder erkannt. Du kannst den ausgelesenen Text rechts kopieren und im Profil einfügen.</p>'}</div><div><h3>Ausgelesener Originaltext</h3><textarea readonly class="source-text">${esc(d.text)}</textarea></div></div><div class="actions"><button class="primary" onclick="applyImport()">Ausgewählte Angaben übernehmen</button><button onclick="$('importModal').remove()">Original behalten, nichts übernehmen</button></div><p class="hint">Ausgewählte Felder ersetzen die bisherigen Angaben nach Bestätigung. Nicht ausgewählte Felder bleiben erhalten.</p></div>`;document.body.appendChild(box);}
function applyImport(){if(!importData||state.selectedProfile!==importData.profileId||current!==importData.applicationId){toast('Profil oder Bewerbung wurde gewechselt. Bitte erneut importieren.');return;}let selected=Object.keys(importData.fields).filter(k=>$('use-'+k)?.checked);if(!selected.length){toast('Bitte mindestens ein Feld auswählen.');return;}let filled=selected.filter(k=>(k in state.profile?state.profile:app())[k]?.trim());if(filled.length&&!confirm('Vorhandene Angaben ersetzen: '+filled.map(k=>fieldNames[k]).join(', ')+'?'))return;for(let k of selected){(k in state.profile?state.profile:app())[k]=$('import-'+k).value;if(sectionNames[k])state.profile.form[k].mode='text';if(k==='address')state.profile.form.contactMode='text';if(k==='letter')app().form.letterMode='text';}let isLetter=selected.some(k=>['letter','salutation','position'].includes(k));$('importModal').remove();page=isLetter?'editor':'profile';if(isLetter)step='text';changed();render();toast('Ausgewählte Angaben übernommen. Bitte Datum und Firmenbezug kontrollieren.');}
function scheduleSpelling(id){if(!$('spell-'+id))return;clearTimeout(spellTimers[id]);spellTimers[id]=setTimeout(()=>{let el=$(id);if(!el)return;if(!el.value.trim()){$('spell-'+id).innerHTML='';return;}bridge('spell',{field:id,text:el.value});},500)}
function renderSpelling(id){let el=$('spell-'+id);if(!el)return;let items=spellData[id]||[];el.innerHTML=items.length?`<strong>⚑ Bitte prüfen: ${items.length} möglicherweise falsch geschriebene Wörter</strong>${items.map((x,i)=>`<div class="spell-row"><b>${esc(x.word)}</b>${x.suggestions.map((v,j)=>`<button onclick="correctWord('${id}',${i},${j})">${esc(v)}</button>`).join('')}<button class="ignore-word" onclick="ignoreWord('${id}',${i})">Wort merken</button></div>`).join('')}<span class="small">Namen und Fachbegriffe können korrekt sein. Geprüft wird die Schreibweise, nicht die Grammatik.</span>`:'<span class="spell-ok">✓ Keine auffälligen Wörter im deutschen Wörterbuchabgleich.</span>';}
function correctWord(id,i,j){let issue=spellData[id][i],el=$(id);let word=issue.word.replace(/[.*+?^${}()|[\]\\]/g,'\\$&');let rx=new RegExp('(?<![\\p{L}])'+word+'(?![\\p{L}])','gu');el.value=el.value.replace(rx,()=>issue.suggestions[j]);el.dispatchEvent(new Event('input',{bubbles:true}));}
function ignoreWord(id,i){activeProfile().dictionary.push(spellData[id][i].word);changed();scheduleSpelling(id)}

let profileStep='contact',photoPreview='',photoTimer,previewOverride=null;

const templateNames=['Seitenleiste','Graphit','Sand','Nordlicht','Elegant','Kontur','Studio','Klar','Modern','Klassisch','Horizont','Editorial'];

function ensureForms(){let p=state.profile;if(!p.form)p.form={};let f=p.form;f.contactMode??=p.address?.trim()?'text':'form';for(let k of ['street','postcode','city','country'])f[k]??='';for(let k of Object.keys(sectionNames))f[k]??={mode:p[k]?.trim()?'text':'form',rows:[]};for(let k of ['summary','projects','hobbies','photo','birthDate','birthPlace','maritalStatus','nationality','signature'])p[k]??='';p.photoSettings??={zoom:1,x:.5,y:.5,shape:'portrait'};for(let a of state.applications){a.form??={};let af=a.form;af.recipientMode??=a.recipient?.trim()?'text':'form';af.letterMode??=a.letter?.trim()?'text':'form';for(let k of ['contact','street','postcode','city','fit','availability'])af[k]??='';af.closing??='Über die Gelegenheit zu einem persönlichen Gespräch freue ich mich.';a.design??={accent:'',font:'Sans',size:10,photo:true,cover:false,order:Object.keys(sectionOrderLabels)};}}
function monthText(v){return /^\d{4}-\d{2}$/.test(v)?v.slice(5)+'/'+v.slice(0,4):v;}
function compileForms(){ensureForms();let p=state.profile,f=p.form;if(f.contactMode==='form')p.address=[f.street,[f.postcode,f.city].filter(Boolean).join(' '),f.country].filter(x=>x.trim()).join('\n');for(let key of Object.keys(sectionNames)){let sec=f[key];if(sec.mode!=='form')continue;p[key]=sec.rows.map(r=>{if(['experience','education'].includes(key)){let dates=[monthText(r.start||''),r.current?'heute':monthText(r.end||'')].filter(Boolean).join(' – ');return [[dates,r.title,r.organization,r.city].filter(x=>x?.trim()).join(' · '),r.details].filter(x=>x?.trim()).join('\n');}return [r.name,r.level].filter(x=>x?.trim()).join(' – ')}).filter(Boolean).join(['experience','education'].includes(key)?'\n\n':'\n');}for(let a of state.applications){let af=a.form;if(af.recipientMode==='form')a.recipient=[a.company,af.contact,af.street,[af.postcode,af.city].filter(Boolean).join(' ')].filter(x=>x.trim()).join('\n');if(af.letterMode==='form')a.letter=[a.motivation,a.evidence,af.fit,af.availability,af.closing].filter(x=>x.trim()).join('\n\n');}}
function formInput(id,label,value,handler,options={}){let multi=options.multi,kind=options.type||'text';return `<div class="${options.wide?'wide':''}"><label class="field"><span>${label}</span>${multi?`<textarea id="${id}" rows="${options.rows||3}" oninput="${handler}" placeholder="${esc(options.placeholder||'')}">${esc(value)}</textarea>`:`<input id="${id}" type="${kind}" value="${esc(value)}" oninput="${handler}" ${options.disabled?'disabled':''} placeholder="${esc(options.placeholder||'')}">`}</label>${multi?`<div class="spelling" id="spell-${id}" aria-live="polite"></div>`:''}</div>`}
function editRow(key,i,k,value){state.profile.form[key].rows[i][k]=value;compileForms();changed();scheduleSpelling(`row-${key}-${i}-${k}`);}
function addRow(key){let row=['experience','education'].includes(key)?{start:'',end:'',current:false,title:'',organization:'',city:'',details:''}:{name:'',level:''};state.profile.form[key].rows.push(row);compileForms();changed();render();}
function moveRow(key,i,d){let rows=state.profile.form[key].rows,j=i+d;if(j<0||j>=rows.length)return;[rows[i],rows[j]]=[rows[j],rows[i]];compileForms();changed();render();}
function removeRow(key,i){if(!confirm('Diesen Eintrag entfernen?'))return;state.profile.form[key].rows.splice(i,1);compileForms();changed();render();}
function convertSection(key){let text=state.profile[key];let rows=text.split(['experience','education'].includes(key)?/\n\s*\n/:/\n/).filter(t=>t.trim()).map(block=>{if(['experience','education'].includes(key)){let lines=block.split('\n'),parts=lines[0].split(' · '),m=parts[0].match(/^(\d{2})\/(\d{4})\s*[–-]\s*(?:(\d{2})\/(\d{4})|(heute))$/);return m?{start:m[2]+'-'+m[1],end:m[3]?m[4]+'-'+m[3]:'',current:!!m[5],title:parts[1]||'',organization:parts[2]||'',city:parts.slice(3).join(' · '),details:lines.slice(1).join('\n')}:{start:'',end:'',current:false,title:'',organization:'',city:'',details:block};}let parts=block.split(' – ');return {name:parts.shift(),level:parts.join(' – ')};});state.profile.form[key]={mode:'form',rows,previousText:text};compileForms();changed();render();toast('Text in Einträge übernommen. Bitte Positionen und Zeiträume prüfen.');}
function structuredSection(key){let sec=state.profile.form[key];if(sec.mode==='text')return `<div class="card"><h2>${sectionNames[key]}</h2><p class="hint">Dein bisheriger Text bleibt erhalten. Du kannst ihn weiterhin frei bearbeiten oder in einzelne Formular-Einträge übernehmen.</p>${field('p',key,sectionNames[key],true)}<button class="primary" onclick="convertSection('${key}')">In ausfüllbare Einträge übernehmen</button></div>`;
return `<div class="card"><h2>${sectionNames[key]}</h2><p class="hint">Einfach die Felder ausfüllen. Restlos setzt jeden Eintrag automatisch in den richtigen Bereich des Lebenslaufs. Die Reihenfolge kannst du mit den Pfeilen ändern.</p>${sec.rows.map((r,i)=>`<div class="entry-card"><div class="entry-heading"><strong>${i+1}. ${esc(r.title||r.name||'Neuer Eintrag')}</strong><div class="actions"><button onclick="moveRow('${key}',${i},-1)" ${i===0?'disabled':''} aria-label="Nach oben">↑</button><button onclick="moveRow('${key}',${i},1)" ${i===sec.rows.length-1?'disabled':''} aria-label="Nach unten">↓</button><button onclick="removeRow('${key}',${i})" aria-label="Entfernen">×</button></div></div><div class="form-grid">${['experience','education'].includes(key)?['start','end','title','organization','city','details'].map(k=>formInput(`row-${key}-${i}-${k}`,{start:'Von',end:'Bis',title:key==='experience'?'Position / Beruf':'Abschluss / Ausbildung',organization:key==='experience'?'Unternehmen':'Schule / Hochschule / Betrieb',city:'Ort',details:'Aufgaben, Schwerpunkte und Erfolge'}[k],r[k]||'',`editRow('${key}',${i},'${k}',this.value)`,{type:['start','end'].includes(k)?'month':'text',multi:k==='details',wide:k==='details',disabled:k==='end'&&r.current,placeholder:k==='details'?'Zum Beispiel: Kundenanfragen bearbeitet und Termine koordiniert.':''})).join(''):`${formInput(`row-${key}-${i}-name`,key==='skills'?'Kenntnis / Werkzeug':'Sprache',r.name,`editRow('${key}',${i},'name',this.value)`)}${formInput(`row-${key}-${i}-level`,'Niveau / Beschreibung',r.level,`editRow('${key}',${i},'level',this.value)`,{placeholder:key==='languages'?'z. B. Muttersprache, B2 oder C1':'z. B. sicherer Umgang, Pivot-Tabellen'})}`}</div>${['experience','education'].includes(key)?`<label class="check-line"><input type="checkbox" ${r.current?'checked':''} onchange="editRow('${key}',${i},'current',this.checked);render()"> Aktuell / bis heute</label>`:''}</div>`).join('')||'<div class="empty">Noch kein Eintrag. Mit „Eintrag hinzufügen“ legst du den ersten an.</div>'}<button class="primary" onclick="addRow('${key}')">+ Eintrag hinzufügen</button></div>`;}
function editContact(k,value){state.profile.form[k]=value;compileForms();changed();}
function contactFields(){let f=state.profile.form;if(f.contactMode==='text')return field('p','address','Adresse',true)+`<button onclick="splitAddress()">Adresse in einzelne Felder übernehmen</button>`;return `<div class="form-grid">${['street','postcode','city','country'].map(k=>formInput('contact-'+k,{street:'Straße und Hausnummer',postcode:'Postleitzahl',city:'Wohnort',country:'Land (optional)'}[k],f[k],`editContact('${k}',this.value)`,{wide:k==='street'})).join('')}</div>`;}
function splitAddress(){let f=state.profile.form,lines=state.profile.address.split('\n');f.previousAddress=state.profile.address;f.street=lines[0]||'';let m=(lines[1]||'').match(/^(\S+)\s+(.*)$/);f.postcode=m?m[1]:'';f.city=m?m[2]:lines[1]||'';f.country=lines.slice(2).join(', ');f.contactMode='form';compileForms();changed();render();}
function photoCard(){let p=state.profile;return `<div class="card"><div class="entry-heading"><h2>Dein Bewerbungsfoto</h2><span class="pill">Optional</span></div><div class="photo-editor"><div class="photo-thumbnail">${p.photo&&photoPreview?`<img id="photoPreview" src="data:image/png;base64,${photoPreview}" alt="Dein Fotoausschnitt">`:'<span>Foto hinzufügen<br>JPG · PNG · WebP</span>'}</div><div><button class="primary" onclick="bridge('photo')">${p.photo?'Foto ersetzen':'Foto auswählen'}</button>${p.photo?`<button onclick="removePhoto()">Foto entfernen</button>`:''}<p class="hint">Das Foto wird im Profilordner gespeichert. Bei Seitenleisten-Vorlagen steht es links über den Kontaktdaten.</p></div></div>${p.photo?`<div class="form-grid"><label class="field"><span>Fotoform</span><select onchange="photoSetting('shape',this.value)">${['portrait','square','round'].map((x,i)=>`<option value="${x}" ${p.photoSettings.shape===x?'selected':''}>${['Hochformat','Quadratisch','Rund'][i]}</option>`).join('')}</select></label>${[['zoom','Vergrößerung',1,3,.05],['x','Ausschnitt horizontal',0,1,.01],['y','Ausschnitt vertikal',0,1,.01]].map(([key,label,min,max,step])=>`<label class="field"><span>${label}</span><input type="range" min="${min}" max="${max}" step="${step}" value="${p.photoSettings[key]}" oninput="photoSetting('${key}',Number(this.value))"></label>`).join('')}</div>`:''}</div>`;}
function nextProfileStep(){let keys=['contact','experience','education','skills','languages','extra'];profileStep=keys[(keys.indexOf(profileStep)+1)%keys.length];render();}
function photoSetting(k,v){state.profile.photoSettings[k]=v;changed();clearTimeout(photoTimer);photoTimer=setTimeout(()=>bridge('photo_preview'),350);}
function removePhoto(){state.profile.photo='';photoPreview='';changed();render();}
function profile(){ensureForms();let tabs={contact:'Kontakt & Foto',experience:'Berufserfahrung',education:'Ausbildung',skills:'Kenntnisse',languages:'Sprachen',extra:'Weitere Angaben'};return `<div class="steps">${Object.entries(tabs).map(([k,label])=>`<button class="${profileStep===k?'active':''}" onclick="profileStep='${k}';render()">${label}</button>`).join('')}</div><div class="grid"><div>${profileStep==='contact'?`<div class="card"><h2>Deine Angaben kommen automatisch an ihren Platz.</h2><p class="hint">Du füllst die Felder aus, Restlos übernimmt die Gestaltung. Die Vorschau rechts zeigt den Lebenslauf der aktuell gewählten Bewerbung.</p><div class="form-grid">${field('p','name','Vor- und Nachname')}${field('p','title','Beruf / Profilüberschrift')}${field('p','email','E-Mail')}${field('p','phone','Telefon')}</div>${contactFields()}<h3>Persönliche Angaben (freiwillig)</h3><p class="hint">Nur ausgefüllte Angaben erscheinen im Lebenslauf. Du entscheidest, was du angeben möchtest.</p><div class="form-grid">${formInput('p-birthDate','Geburtsdatum',state.profile.birthDate,"update('p','birthDate',this.value)",{type:'date'})}${field('p','birthPlace','Geburtsort')}${field('p','maritalStatus','Familienstand')}${field('p','nationality','Staatsangehörigkeit')}</div><button onclick="page='documents';render()">Vorhandenen Lebenslauf importieren →</button></div>${photoCard()}`:profileStep==='extra'?`<div class="card"><h2>Weitere Angaben – nur wenn sie zu dir passen.</h2>${field('p','summary','Kurzprofil',true,'Zwei bis drei Sätze zu deiner Erfahrung und deinem Schwerpunkt.')}${field('p','projects','Projekte & Engagement',true,'Projekt / Ehrenamt und dein konkreter Beitrag.')}${field('p','hobbies','Interessen (optional)',true,'Relevante Interessen oder Aktivitäten.')}</div>`:structuredSection(profileStep)}<div class="actions"><button onclick="navigate('editor')">Zur Bewerbung →</button><button onclick="nextProfileStep()">Nächster Bereich →</button></div></div>${previewPanel('Lebenslauf · automatisch aus deinen Angaben')}</div>`;}
function previewPanel(caption){return `<div class="preview"><header><strong>Echte PDF-Vorschau</strong><span class="small" id="previewStatus">Wird erstellt …</span></header><div id="pages"><div class="placeholder">Deine Angaben werden automatisch eingeordnet.</div></div><div class="small">${caption}</div></div>`;}
function editApplicationForm(k,v){app().form[k]=v;compileForms();changed();scheduleSpelling('af-'+k);}
function recipientForm(){let a=app(),f=a.form;return f.recipientMode==='text'?field('a','recipient','Empfänger und Firmenanschrift',true):`<div class="form-grid">${['contact','street','postcode','city'].map(k=>formInput('af-'+k,{contact:'Ansprechperson / Abteilung',street:'Straße und Hausnummer',postcode:'Postleitzahl',city:'Ort des Unternehmens'}[k],f[k],`editApplicationForm('${k}',this.value)`,{wide:k==='street'})).join('')}</div>`;}
function letterMode(mode){let a=app();if(mode===a.form.letterMode)return;if(mode==='form'&&a.letter.trim()){if(!confirm('Den bestehenden Text in den ersten Formularabschnitt übernehmen? Der gesamte Wortlaut bleibt erhalten und lässt sich anschließend auf die Abschnitte verteilen.'))return;a.motivation=a.letter;a.evidence='';a.form.fit='';a.form.availability='';a.form.closing='';}a.form.letterMode=mode;compileForms();changed();render();}
function letterEditor(){let a=app();return `<div class="card"><h2>Dein Anschreiben – Abschnitt für Abschnitt.</h2><p class="hint">Absender, Empfänger, Datum und Betreff werden automatisch platziert. Deine Antworten bilden die Absätze in der richtigen Reihenfolge.</p><div class="steps"><button class="${a.form.letterMode==='form'?'active':''}" onclick="letterMode('form')">Formular ausfüllen</button><button class="${a.form.letterMode==='text'?'active':''}" onclick="letterMode('text')">Text frei bearbeiten</button></div>${field('a','salutation','Anrede')}${a.form.letterMode==='form'?`${field('a','motivation','1. Einstieg: Warum dieser Beruf und diese Stelle?',true,'Was interessiert dich konkret an dieser Aufgabe?')}${examples('motivation')}${field('a','evidence','2. Erfahrung: Was bringst du mit?',true,'Beschreibe eine passende Aufgabe oder einen belegbaren Erfolg.')}${examples('evidence')}${formInput('af-fit','3. Bezug zum Unternehmen (optional)',a.form.fit,"editApplicationForm('fit',this.value)",{multi:true,placeholder:'Welche konkrete Aufgabe oder Arbeitsweise des Unternehmens spricht dich an?'})}${examples('fit')}${formInput('af-availability','4. Verfügbarkeit (optional)',a.form.availability,"editApplicationForm('availability',this.value)",{multi:true,placeholder:'Zum Beispiel: Ein Einstieg ist mir ab dem 1. Dezember möglich.'})}${examples('availability')}${formInput('af-closing','5. Abschluss',a.form.closing,"editApplicationForm('closing',this.value)",{multi:true})}${examples('closing')}<div class="hint">Grußformel und dein Name werden automatisch ergänzt. Die Absätze erscheinen sofort in der Vorschau.</div>`:field('a','letter','Dein vollständiger Text',true)+examples('') }</div>`;}
function setDesign(key,value){app().design[key]=value;changed();if(key==='cover')render();}
function moveSection(i,d){let list=app().design.order,j=i+d;if(j<0||j>=list.length)return;[list[i],list[j]]=[list[j],list[i]];changed();render();}
function designEditor(){let a=app();return `<div class="card"><h2>Deine Bewerbung. Dein Stil.</h2><p class="hint">Zwölf eigenständige Vorlagen. Alle verwenden deine Formulardaten und passen Anschreiben und Deckblatt farblich an.</p><div class="template-grid">${templateNames.map(t=>`<button class="template ${a.template===t?'selected':''}" onclick="update('a','template','${t}');render()"><div class="mini ${sidebarNames.includes(t)?'sidebar-mini '+t:''} ${t==='Horizont'?'banner-mini':''} ${t==='Editorial'?'editorial-mini':''}"><b>Dein Name</b><i></i><i></i><i></i><i></i><i></i></div>${t}</button>`).join('')}</div><div class="form-grid"><label class="field"><span>Akzentfarbe</span><input type="color" value="${a.design.accent||'#167c77'}" oninput="setDesign('accent',this.value)"></label><button onclick="setDesign('accent','');render()">Vorlagenfarbe verwenden</button><label class="field"><span>Schrift</span><select onchange="setDesign('font',this.value)">${['Sans','Serif'].map(x=>`<option ${a.design.font===x?'selected':''}>${x}</option>`).join('')}</select></label><label class="field"><span>Textgröße</span><select onchange="setDesign('size',Number(this.value))">${[9,10,11].map(x=>`<option value="${x}" ${a.design.size===x?'selected':''}>${x} pt</option>`).join('')}</select></label></div><label class="check-line"><input type="checkbox" ${a.design.photo?'checked':''} onchange="setDesign('photo',this.checked)"> Profilfoto in dieser Bewerbung anzeigen</label><label class="check-line"><input type="checkbox" ${a.design.cover?'checked':''} onchange="setDesign('cover',this.checked)"> Optionales Deckblatt voranstellen</label><p class="hint">Das Foto fügst du unter „Mein Profil → Kontakt & Foto“ hinzu. Das Deckblatt nutzt Position, Firma, Kontaktdaten und Foto automatisch.</p><div class="actions"><button onclick="previewOverride='cover';requestPreview()">Deckblatt ansehen</button><button onclick="previewOverride=null;requestPreview()">Lebenslauf ansehen</button></div></div><div class="card"><h2>Reihenfolge der Abschnitte</h2><p class="hint">Leere Bereiche werden nicht ausgegeben. Bei Seitenleisten bleiben Kenntnisse und Sprachen links.</p>${a.design.order.map((k,i)=>`<div class="section-row"><span>${sectionOrderLabels[k]}</span><button onclick="moveSection(${i},-1)" ${i===0?'disabled':''}>↑</button><button onclick="moveSection(${i},1)" ${i===a.design.order.length-1?'disabled':''}>↓</button></div>`).join('')}</div>`;}

function duplicateApp(id){flush();current=id;bridge('duplicate_application');}
function showExportReport(r){$('exportReport')?.remove();let m=document.createElement('div');m.id='exportReport';m.className='modal';m.innerHTML=`<div class="modal-content" style="max-width:720px"><h2>PDF gespeichert und geprüft</h2><p>${r.pages} Seiten · ${r.mb} MB · ${r.textPages} Seiten mit auslesbarem Text</p><p class="hint" style="overflow-wrap:anywhere">${esc(r.path)}</p>${r.warnings.map(w=>`<div class="issue warn">${esc(w)}</div>`).join('')||'<div class="issue good">Keine Auffälligkeiten bei Dateigröße und den geprüften Pflichtangaben.</div>'}<p class="hint">Bitte den Inhalt und die Anlagen vor dem Versand selbst prüfen. Die Prüfung ist keine Garantie für fehlerfreie Bewerbungen.</p><div class="actions"><button onclick="bridge('open_folder',{application:true})">Bewerbungsordner öffnen</button><button class="primary" onclick="$('exportReport').remove()">Fertig</button></div></div>`;document.body.appendChild(m);}
</script><script src="workspace.js"></script><script src="example-data.js"></script><script src="example-assistant.js"></script><script src="signature-fonts.js"></script><script src="signature.js"></script><script src="signature-maker.js"></script><script src="settings.js"></script><script>bridge('load');
</script></html>
