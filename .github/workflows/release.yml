# Builds, signs and publishes a Restlos Bewerbung release automatically whenever program
# files change on main (e.g. after merging a pull request), when a version tag is pushed or
# when started by hand under "Actions".
#  - VERSION raised by hand (e.g. 0.14.0) → that version is released.
#  - Program changed but VERSION not raised → the patch number is raised automatically
#    (0.13.0 → 0.13.1), committed to main and released.
#  - Only documentation/tests/workflow changed → nothing happens. The installed programs then
# offer the update via "Updates & Startcheck".
#
# One-time setup: Settings → Secrets and variables → Actions → New repository secret
#   Name:  RESTLOS_SIGNING_KEY
#   Value: the complete content of your private Ed25519 key (private.pem),
#          including the BEGIN/END lines.
# The key only exists as a temporary file inside the build and is deleted afterwards.
name: Release

on:
  push:
    branches: [main]
    tags: ['v*.*.*']
  workflow_dispatch:

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Version bestimmen
        id: version
        run: |
          VERSION="$(cat VERSION)"
          if [ "${GITHUB_REF_TYPE}" = "tag" ] && [ "${GITHUB_REF_NAME}" != "v$VERSION" ]; then
            echo "::error::Tag ${GITHUB_REF_NAME} passt nicht zur Datei VERSION ($VERSION)."; exit 1
          fi
          LATEST="$(gh release view --json tagName --jq .tagName 2>/dev/null | sed 's/^v//')"
          if ! gh release view "v$VERSION" >/dev/null 2>&1; then
            echo "Neue Version $VERSION aus der Datei VERSION."
            echo "build=true" >> "$GITHUB_OUTPUT"; echo "version=$VERSION" >> "$GITHUB_OUTPUT"; echo "since=$LATEST" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # Release exists already: only program changes since then lead to an automatic patch release.
          CHANGED="$(git diff --name-only "v$VERSION" HEAD -- . ':(exclude)*.md' ':(exclude)tests/**' ':(exclude).github/**' ':(exclude).gitignore' || true)"
          if [ -z "$CHANGED" ]; then
            echo "::notice::Keine Programmänderung seit v$VERSION – kein neues Release."
            echo "build=false" >> "$GITHUB_OUTPUT"; exit 0
          fi
          echo "Geänderte Programmdateien:"; echo "$CHANGED"
          NEXT="$(python3 -c "import sys;a,b,c=map(int,sys.argv[1].split('.'));print(f'{a}.{b}.{c+1}')" "$VERSION")"
          while gh release view "v$NEXT" >/dev/null 2>&1; do
            NEXT="$(python3 -c "import sys;a,b,c=map(int,sys.argv[1].split('.'));print(f'{a}.{b}.{c+1}')" "$NEXT")"
          done
          echo "$NEXT" > VERSION
          sed -i "s/version:'$VERSION'/version:'$NEXT'/; s/version||'$VERSION'/version||'$NEXT'/" settings.js
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -am "Version $NEXT (automatisches Release)"
          git push origin HEAD:main
          echo "build=true" >> "$GITHUB_OUTPUT"; echo "version=$NEXT" >> "$GITHUB_OUTPUT"; echo "since=$VERSION" >> "$GITHUB_OUTPUT"
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Signierschlüssel vorhanden?
        if: steps.version.outputs.build == 'true'
        run: |
          if [ -z "$SIGNING_KEY" ]; then
            echo "::error::Secret RESTLOS_SIGNING_KEY fehlt (Settings → Secrets and variables → Actions)."; exit 1
          fi
        env:
          SIGNING_KEY: ${{ secrets.RESTLOS_SIGNING_KEY }}

      - name: Systempakete
        if: steps.version.outputs.build == 'true'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq libxcb-cursor0 fonts-dejavu-core poppler-utils openssl dpkg-dev

      - name: Python-Bibliotheken (lib/) und native/ wie im bisherigen Paket
        if: steps.version.outputs.build == 'true'
        run: |
          python3 --version
          python3 -m pip install --quiet --target lib -r requirements.txt
          mkdir -p native
          cp -L /usr/lib/x86_64-linux-gnu/libxcb-cursor.so.0 native/libxcb-cursor.so.0
          cp -L /usr/lib/x86_64-linux-gnu/libxcb-cursor.so.0 native/libxcb-cursor.so.0.0.0
          cp /usr/share/doc/libxcb-cursor0/copyright native/COPYRIGHT

      - name: Tests
        if: steps.version.outputs.build == 'true'
        run: |
          python3 -m pip install --quiet pytest
          python3 -m pytest -q tests/test_fixes.py tests/test_v011.py tests/test_v012.py tests/test_v013.py
          python3 tests/test_updates.py

      - name: Signiertes Release bauen
        if: steps.version.outputs.build == 'true'
        run: |
          KEY="$RUNNER_TEMP/private.pem"
          (umask 077; printf '%s\n' "$SIGNING_KEY" > "$KEY")
          python3 tools/build_release.py --runtime . --key "$KEY" --output dist
          rm -f "$KEY"
          ls -la dist
        env:
          SIGNING_KEY: ${{ secrets.RESTLOS_SIGNING_KEY }}

      - name: Release-Notizen aus README
        if: steps.version.outputs.build == 'true'
        run: |
          python3 - <<'PY'
          import re
          v = open('VERSION').read().strip()
          short = re.sub(r'\.0$', '', v)
          text = open('README.md', encoding='utf-8').read()
          m = re.search(r'^## Neu in (?:' + re.escape(v) + '|' + re.escape(short) + r')\b.*?(?=^## )', text, re.S | re.M)
          if m:
              notes = m.group(0)
          else:
              import subprocess, os
              since = os.environ.get('SINCE', '')
              log = subprocess.run(['git', 'log', '--no-merges', '--pretty=- %s', ('v' + since + '..HEAD') if since else 'HEAD~20..HEAD'],
                                   capture_output=True, text=True).stdout.strip()
              log = '\n'.join(l for l in log.splitlines() if 'automatisches Release' not in l)
              notes = '## Restlos Bewerbung ' + v + '\n\n' + (log or 'Verbesserungen und Fehlerbehebungen.')
          open('RELEASE-NOTES.md', 'w', encoding='utf-8').write(notes + '\n\nDaten bleiben lokal. Installierte Versionen ab 0.6 aktualisieren sich über „Updates & Startcheck“.\n')
          PY
        env:
          SINCE: ${{ steps.version.outputs.since }}

      - name: Auf GitHub veröffentlichen
        if: steps.version.outputs.build == 'true'
        run: |
          V="${{ steps.version.outputs.version }}"
          gh release create "v$V" --target "$(git rev-parse HEAD)" dist/restlos-bewerbung-$V.zip dist/restlos-bewerbung_${V}_amd64.deb dist/restlos-update.json dist/restlos-update.sig \
            --title "Restlos Bewerbung $V" --notes-file RELEASE-NOTES.md --latest
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Schlüssel sicher entfernen
        if: always()
        run: rm -f "$RUNNER_TEMP/private.pem"
